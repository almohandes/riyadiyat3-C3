name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت الحزم
        run: npm install

      - name: فحص بيانات الدروس
        run: npm test

      - name: إنشاء مشروع أندرويد
        run: |
          rm -rf android
          npx cap add android
          npm run assets
          npx cap sync android

      - name: رقم الإصدار
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: مفتاح توقيع ثابت (لتحديث التطبيق دون حذفه)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: تسمية الملف
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/riyadiyat3-v${{ github.run_number }}.apk"

      - name: رفع الملف كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyadiyat3-apk
          path: dist/*.apk

      - name: نشر إصدار (Release) مع ملف APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: رياضيات الثالث – الإصدار ${{ github.run_number }}
          body: |
            حمّل ملف APK أدناه وثبّته على الموبايل أو التابلت.
            (قد تحتاج تفعيل «السماح بالتثبيت من مصادر غير معروفة»)
          files: dist/*.apk
          fail_on_unmatched_files: true
