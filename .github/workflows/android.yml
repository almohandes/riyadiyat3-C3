name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK preinstalled.
      # (android-actions/setup-android is removed: it failed with "Failed to find package 'tools'")
      - name: Android SDK (preinstalled) - accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Install packages
        run: npm install

      - name: Check lesson data
        run: |
          if [ -f tools/check-data.js ]; then node tools/check-data.js; fi

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1D2B53' --iconBackgroundColorDark '#1D2B53' --splashBackgroundColor '#F7FBFF' --splashBackgroundColorDark '#1D2B53' || echo "assets skipped"
          npx cap sync android

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Fixed signing key (update without uninstalling)
        run: |
          if [ -f keystore/debug.keystore ]; then
            mkdir -p ~/.android
            cp keystore/debug.keystore ~/.android/debug.keystore
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/riyadiyat3-v${{ github.run_number }}.apk"
          if [ -f tools/build-single.py ]; then python3 tools/build-single.py || true; fi
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyadiyat3-apk
          path: dist/*

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Riyadiyat 3 - build ${{ github.run_number }}
          files: dist/*
